<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NodeMCU USB Test</title>
</head>
<body>
  <h2>NodeMCU USB Communication</h2>

  <button id="connect">Hubungkan NodeMCU</button>

  <h3>Status:</h3>
  <p id="status">Belum terhubung</p>

  <h3>Data diterima:</h3>
  <h2 id="result">Menunggu data...</h2>

  <script>
    let port;
    let reader;

    document.getElementById("connect").onclick =
      connectNodeMCU;

    async function connectNodeMCU() {
      try {
        port = await navigator.serial.requestPort();

        await port.open({ baudRate: 9600 });

        document.getElementById("status").textContent =
          "NodeMCU terhubung";

        readData();

      } catch (error) {
        document.getElementById("status").textContent =
          "Gagal: " + error.message;
      }
    }

    async function readData() {
      const decoder = new TextDecoderStream();
      port.readable.pipeTo(decoder.writable);

      reader = decoder.readable.getReader();

      let buffer = "";

      try {
        while (true) {
          const { value, done } = await reader.read();

          if (done) break;

          buffer += value;

          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop();

          for (const data of lines) {
            processData(data.trim());
          }
        }
      } catch (error) {
        document.getElementById("status").textContent =
          "Koneksi terputus";
      }
    }

    function processData(data) {
      const result = document.getElementById("result");

      if (data === "ACCESS:1") {
        result.textContent = "AKSES DITERIMA - USER 1";
      }
      else if (data === "ACCESS:2") {
        result.textContent = "AKSES DITERIMA - USER 2";
      }
      else if (data === "ACCESS:DENIED") {
        result.textContent = "AKSES DITOLAK";
      }
      else if (data === "SYSTEM:READY") {
        result.textContent = "NodeMCU siap digunakan";
      }
      else {
        result.textContent = data;
      }
    }
  </script>
</body>
</html>
